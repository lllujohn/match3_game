name: CI — Build & Test

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ============================================================
  #  macOS (Clang, Apple Silicon & x86_64 via Rosetta)
  # ============================================================
  build-macos:
    name: macOS (Clang / Apple Silicon)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SDL2 family (Homebrew)
        run: |
          brew update
          brew install sdl2 sdl2_ttf sdl2_image sdl2_mixer

      - name: Configure (CMake)
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DMATCH3_ENABLE_TESTS=ON \
            -DMATCH3_ENABLE_ASAN=ON

      - name: Build
        run: cmake --build build --parallel $(sysctl -n hw.logicalcpu)

      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure

  # ============================================================
  #  Linux (GCC)
  # ============================================================
  build-linux:
    name: Linux (GCC)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SDL2 family (apt)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libsdl2-dev libsdl2-ttf-dev libsdl2-image-dev libsdl2-mixer-dev \
            cmake gcc valgrind

      - name: Configure (CMake)
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DMATCH3_ENABLE_TESTS=ON \
            -DMATCH3_ENABLE_ASAN=ON

      - name: Build
        run: cmake --build build --parallel $(nproc)

      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Valgrind memcheck (model tests)
        run: |
          valgrind --error-exitcode=1 --leak-check=full \
            ./build/tests/test_model

  # ============================================================
  #  Windows (MSVC 2022)
  # ============================================================
  build-windows:
    name: Windows (MSVC 2022)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SDL2 family (vcpkg)
        run: |
          vcpkg integrate install
          vcpkg install sdl2 sdl2-ttf sdl2-image sdl2-mixer --triplet x64-windows

      - name: Configure (CMake + vcpkg toolchain)
        shell: pwsh
        run: |
          cmake -B build `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET="x64-windows" `
            -DCMAKE_BUILD_TYPE=Debug `
            -DMATCH3_ENABLE_TESTS=ON

      - name: Build
        run: cmake --build build --config Debug --parallel

      - name: Run unit tests
        run: ctest --test-dir build -C Debug --output-on-failure
